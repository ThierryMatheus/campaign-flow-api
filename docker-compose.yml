services:
  mysql:
    image: mysql:8.0
    container_name: campaignflow_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: campaignflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: campaignflow
      MYSQL_PASSWORD: secret
    volumes:
      - campaignflow_mysql_data:/var/lib/mysql
    networks:
      - campaignflow

  redis:
    image: redis:7-alpine
    container_name: campaignflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - campaignflow

  postgres:
    image: postgres:16
    container_name: campaignflow_postgres
    environment:
      POSTGRES_DB: campaignflow
      POSTGRES_USER: campaignflow
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - campaignflow_postgres_data:/var/lib/postgresql/data
    networks:
      - campaignflow

volumes:
  campaignflow_mysql_data:
  campaignflow_postgres_data:

networks:
  campaignflow:
    driver: bridge
