services:
  mysql:
    image: mysql:8.0
    container_name: campaignflow_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: campaignflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: campaignflow
      MYSQL_PASSWORD: secret
    volumes:
      - campaignflow_mysql_data:/var/lib/mysql
    networks:
      - campaignflow

  redis:
    image: redis:7-alpine
    container_name: campaignflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - campaignflow

volumes:
  campaignflow_mysql_data:

networks:
  campaignflow:
    driver: bridge